name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository (Pinned SHA)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2e230e8fe0ad3a14a3407003297ea9765f27c443 # v3.25.10
      with:
        languages: javascript, java
        queries: security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2e230e8fe0ad3a14a3407003297ea9765f27c443 # v3.25.10
      with:
        category: "/language:javascript"
